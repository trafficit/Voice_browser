# Слово(а)-переключатель "включить ассистента". Пока не сказано ни одно из них,
# ассистент ничего не делает - просто молча слушает. Можно перечислить
# несколько синонимов через запятую, сработает любой.
start_word: "запустись,запусти,запускай,включись"

# Слово(а)-переключатель "выключить ассистента". Любое из них в активном
# режиме останавливает ассистента, и он снова ждёт start_word.
# Осторожно с "стоп"/"останови" по отдельности - эти слова уже используются
# в командах паузы ("стоп видео", "останови") и совпадение перебьёт паузу на
# полное выключение ассистента.
stop_word: "остановись,выключись,хватит"

# Если в активном режиме долго (столько секунд) вообще ничего не сказано -
# ассистент сам возвращается в режим ожидания start_word. Доп. защита от
# случайных срабатываний на фоновые звуки/ТВ, если забыли сказать stop_word.
auto_stop_after_s: 600

# true  -> ребёнок может включать ТОЛЬКО ролики/фильмы из списка favorites ниже
#          (свободный поиск отключен, самый безопасный режим)
# false -> дополнительно разрешён поиск по фразе "найди ..." на youtubekids.com
strict_whitelist: false

# Стартовая страница при запуске
home_url: "https://www.youtubekids.com/"

# Любимые мультики/фильмы ребёнка: ключевая фраза -> прямая ссылка.
# Добавляйте сюда ТОЛЬКО ссылки с легальных источников, на которых у вас есть
# доступ к контенту (купленные/арендованные фильмы в Кинопоиск HD, Okko, IVI,
# Wink, Google Play/Apple TV, YouTube-аренда, либо ваш собственный
# Plex/Jellyfin с уже купленными дисками/цифрой). НЕ используйте пиратские
# сайты (hdrezka и подобные) - это нарушение авторских прав и юридический
# риск для вас, поэтому такие ссылки сюда добавлять не стоит.
#
# Пример (раскомментируйте и вставьте вашу реальную легальную ссылку):
# favorites:
#   "синий трактор": "https://www.youtubekids.com/watch?v=ВАША_ССЫЛКА"
#   "маша и медведь": "https://www.youtubekids.com/channel/ВАШ_КАНАЛ"
#   "моана": "https://hd.kinopoisk.ru/film/ВАША_ССЫЛКА"
#   "миньоны 1": "https://okko.tv/movie/ВАША_ССЫЛКА"
#   "миньоны 2": "https://okko.tv/movie/ВАША_ССЫЛКА"
#   "миньоны 3": "https://okko.tv/movie/ВАША_ССЫЛКА"
#   "монстры на каникулах": "https://ivi.ru/watch/ВАША_ССЫЛКА"
favorites: {}
